```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELONTE — Checkout</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f2ec;
  color:#171717;
  font-family:Georgia,"Times New Roman",serif;
}

.checkout-page{
  max-width:1100px;
  margin:auto;
  padding:90px 6%;
}

.back-link{
  display:inline-block;
  margin-bottom:35px;
  color:#777;
  text-decoration:none;
  font:12px Arial,sans-serif;
  letter-spacing:1px;
}

.checkout-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:start;
}

.checkout-title{
  font-size:clamp(40px,5vw,62px);
  font-weight:400;
  line-height:1.08;
  margin:0 0 35px;
}

.section-label{
  font:10px Arial,sans-serif;
  letter-spacing:3px;
  color:#777;
  text-transform:uppercase;
  margin-bottom:15px;
}

.product-card{
  background:#ebe7df;
  padding:25px;
}

.product-image{
  width:100%;
  height:420px;
  background:#f5f2ec;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:25px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:25px;
}

.product-name{
  font-size:24px;
  line-height:1.2;
  margin-bottom:15px;
}

.product-detail{
  font:13px Arial,sans-serif;
  color:#777;
  line-height:1.8;
}

.product-price{
  margin-top:15px;
  font:14px Arial,sans-serif;
}

.product-price strong{
  font-size:20px;
  margin-left:8px;
}

.form-box{
  background:#fff;
  padding:30px;
  border:1px solid #ddd;
}

.form-title{
  font-size:25px;
  font-weight:400;
  margin-bottom:25px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font:11px Arial,sans-serif;
  letter-spacing:1px;
  color:#666;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px 14px;
  border:1px solid #ccc;
  background:#fff;
  outline:none;
  font:13px Arial,sans-serif;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.state-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.quantity-box{
  display:flex;
  align-items:center;
  width:140px;
  height:45px;
  border:1px solid #ccc;
  background:#fff;
}

.quantity-box button{
  width:42px;
  height:100%;
  border:0;
  background:#fff;
  font-size:18px;
  cursor:pointer;
}

.quantity-box span{
  flex:1;
  text-align:center;
  font:13px Arial,sans-serif;
}

.offer{
  margin:10px 0 20px;
  font:11px Arial,sans-serif;
  color:#777;
}

.summary{
  border-top:1px solid #ddd;
  margin-top:25px;
  padding-top:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font:13px Arial,sans-serif;
  color:#666;
}

.summary-row.total{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #ddd;
  color:#111;
  font-size:16px;
}

.place-order{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:1px solid #111;
  background:#111;
  color:#fff;
  cursor:pointer;
  font:11px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}

.place-order:hover{
  background:transparent;
  color:#111;
}

.note{
  margin-top:18px;
  text-align:center;
  font:11px Arial,sans-serif;
  color:#999;
  line-height:1.6;
}

@media(max-width:800px){
  .checkout-page{
    padding:60px 5%;
  }

  .checkout-grid{
    grid-template-columns:1fr;
    gap:35px;
  }

  .product-image{
    height:360px;
  }

  .state-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="checkout-page">

<a href="index.html#collection" class="back-link">
← Back to Collection
</a>

<div class="checkout-grid">

<!-- PRODUCT -->
<div>

<div class="section-label">
Your Selection
</div>

<h1 class="checkout-title">
Checkout
</h1>

<div class="product-card">

<div class="product-image">
<img id="productImage" src="" alt="">
</div>

<div class="product-name" id="productName">
Loading product...
</div>

<div class="product-detail">
<div id="productSize"></div>
<div id="productQuantity"></div>
</div>

<div class="product-price">
<span>Price:</span>
<strong id="productPrice">₹0</strong>
</div>

</div>

</div>


<!-- CUSTOMER DETAILS -->
<div>

<div class="form-box">

<div class="section-label">
Delivery Details
</div>

<div class="form-title">
Complete Your Order
</div>

<form id="checkoutForm">

<div class="field">
<label for="customerName">Full Name</label>
<input
type="text"
id="customerName"
placeholder="Your full name"
required>
</div>

<div class="field">
<label for="mobile">Mobile Number</label>
<input
type="tel"
id="mobile"
inputmode="numeric"
maxlength="10"
pattern="[0-9]{10}"
placeholder="10-digit mobile number"
required>
</div>

<div class="field">
<label for="email">Email Address</label>
<input
type="email"
id="email"
placeholder="Your email address"
required>
</div>

<div class="field">
<label for="address">Address</label>
<textarea
id="address"
placeholder="House / Flat, Street, Area"
required></textarea>
</div>

<div class="state-row">

<div class="field">
<label for="state">State</label>

<select id="state" required>
<option value="">Select State</option>
<option>Andhra Pradesh</option>
<option>Arunachal Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Himachal Pradesh</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>
<option>Delhi</option>
<option>Jammu and Kashmir</option>
<option>Ladakh</option>
<option>Chandigarh</option>
<option>Puducherry</option>
</select>

</div>

<div class="field">
<label for="pincode">PIN Code</label>
<input
type="text"
id="pincode"
inputmode="numeric"
maxlength="6"
pattern="[0-9]{6}"
placeholder="6-digit PIN"
required>
</div>

</div>


<div class="field">

<label>Quantity</label>

<div class="quantity-box">

<button
type="button"
onclick="changeQuantity(-1)">
−
</button>

<span id="quantity">1</span>

<button
type="button"
onclick="changeQuantity(1)">
+
</button>

</div>

<div class="offer">
Buy 2 or more & get 5% OFF
</div>

</div>


<div class="summary">

<div class="summary-row">
<span>Product</span>
<span id="summaryProduct">₹0</span>
</div>

<div class="summary-row">
<span>Quantity</span>
<span id="summaryQuantity">1</span>
</div>

<div class="summary-row">
<span>Discount</span>
<span id="summaryDiscount">₹0</span>
</div>

<div class="summary-row">
<span>Shipping</span>
<span>FREE</span>
</div>

<div class="summary-row total">
<span>Total</span>
<strong id="summaryTotal">₹0</strong>
</div>

</div>


<button
type="submit"
class="place-order">
Place Order
</button>

<div class="note">
Secure checkout. Payment options will be connected through Razorpay.
</div>

</form>

</div>

</div>

</div>

</div>


<script>

let params = new URLSearchParams(window.location.search);

let product =
params.get("product") || "VELONTE Product";

let price =
Number(params.get("price")) || 0;

let image =
params.get("image") || "";

let size =
params.get("size") || "";

let quantity =
Number(params.get("quantity")) || 1;

if(quantity < 1){
quantity = 1;
}


/* PRODUCT DISPLAY */

document.getElementById("productName").textContent =
product;

document.getElementById("productPrice").textContent =
"₹" + price.toLocaleString("en-IN");

document.getElementById("productSize").textContent =
size ? "Size: " + size : "";

document.getElementById("productQuantity").textContent =
"Quantity: " + quantity;

document.getElementById("productImage").src =
image;

document.getElementById("productImage").alt =
product;

document.getElementById("quantity").textContent =
quantity;


/* SUMMARY */

function updateSummary(){

let subtotal =
price * quantity;

let discount = 0;

if(quantity >= 2){
discount =
Math.round(subtotal * 0.05);
}

let total =
subtotal - discount;

document.getElementById("summaryProduct").textContent =
"₹" + subtotal.toLocaleString("en-IN");

document.getElementById("summaryQuantity").textContent =
quantity;

document.getElementById("summaryDiscount").textContent =
discount > 0
? "- ₹" + discount.toLocaleString("en-IN")
: "₹0";

document.getElementById("summaryTotal").textContent =
"₹" + total.toLocaleString("en-IN");

document.getElementById("productQuantity").textContent =
"Quantity: " + quantity;

}

updateSummary();


/* QUANTITY */

function changeQuantity(change){

quantity += change;

if(quantity < 1){
quantity = 1;
}

document.getElementById("quantity").textContent =
quantity;

updateSummary();

}


/* FORM */

document.getElementById("checkoutForm").addEventListener(
"submit",
function(e){

e.preventDefault();

const name =
document.getElementById("customerName").value.trim();

const mobile =
document.getElementById("mobile").value.trim();

const email =
document.getElementById("email").value.trim();

const address =
document.getElementById("address").value.trim();

const state =
document.getElementById("state").value;

const pincode =
document.getElementById("pincode").value.trim();


if(!/^[0-9]{10}$/.test(mobile)){
alert("Please enter a valid 10-digit mobile number.");
return;
}

if(!/^[0-9]{6}$/.test(pincode)){
alert("Please enter a valid 6-digit PIN code.");
return;
}


const discount =
quantity >= 2
? Math.round(price * quantity * 0.05)
: 0;

const total =
(price * quantity) - discount;


/*
  TEMPORARY ORDER CONFIRMATION

  Razorpay can be connected here next.
*/

alert(
"VELONTE\n\n" +
"Order Details\n\n" +
"Product: " + product + "\n" +
(size ? "Size: " + size + "\n" : "") +
"Quantity: " + quantity + "\n" +
"Total: ₹" + total.toLocaleString("en-IN") + "\n\n" +
"Thank you, " + name + "!"
);

});

</script>

</body>
</html>
```
